      <stop offset="0%" stop-color="#0F3821" />
      <stop offset="100%" stop-color="#1A4D2E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
  </defs>
  <!-- Background Shield/Rounded Square -->
  <rect x="10" y="10" width="180" height="180" rx="42" fill="url(#forestGrad)" />
  <rect x="14" y="14" width="172" height="172" rx="38" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.6" stroke-dasharray="8 4" fill="none" />
  
